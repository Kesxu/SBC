<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swaraj Book Club</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(0, 0, 0);
            background-image: url('94afc362d77254707022c6a63be2893a.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            transition: opacity 1s ease-in-out;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.56); /* This creates the 0.44 opacity effect */
            z-index: 1;
        }
        
        .fade-out {
            opacity: 0;
        }
        .logo-container {
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .logo-container img {
            max-width: 80%;
            max-height: 80vh;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="SBC-removebg-preview (1)(1).png" alt="Swaraj Book Club Logo">
    </div>
    
    <script>
        // Wait for the page to load
        window.onload = function() {
            // Start fade out after 2 seconds
            setTimeout(function() {
                document.body.classList.add('fade-out');
                
                // Redirect after the fade out completes (1 second)
                setTimeout(function() {
                    window.location.href = 'homepage.html';
                }, 1000);
                
            }, 2000); // Initial delay before starting fade out
        };
    </script>
</body>
</html>
